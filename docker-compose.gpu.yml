services:
  ocr-api-gpu:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    container_name: paddleocr-api-gpu
    ports:
      - "8000:8000"
    environment:
      - PADDLE_DEVICE=gpu
      - MODEL_LANG=en
      - MAX_IMAGE_SIZE_MB=20
      - MAX_BATCH_SIZE=20
      - JOB_BACKEND=filesystem
      - JOB_DIR=/tmp/ocr_jobs
      - LOG_LEVEL=INFO
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ocr_jobs:/tmp/ocr_jobs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: paddleocr-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    profiles:
      - with-redis

volumes:
  ocr_jobs:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: paddleocr-network
