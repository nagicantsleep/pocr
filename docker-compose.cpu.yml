services:
  ocr-api-cpu:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    container_name: paddleocr-api-cpu
    ports:
      - "8000:8000"
    environment:
      - PADDLE_DEVICE=cpu
      - MODEL_LANG=en
      - MAX_IMAGE_SIZE_MB=20
      - MAX_BATCH_SIZE=20
      - LOG_LEVEL=INFO
      - JOB_DIR=/tmp/ocr_jobs
      - STANDARDIZER_PROVIDER=${STANDARDIZER_PROVIDER:-heuristic}
      - STANDARDIZER_MODEL=${STANDARDIZER_MODEL:-openrouter/owl-alpha}
      - STANDARDIZER_API_KEY=${STANDARDIZER_API_KEY:-}
      - STANDARDIZER_BASE_URL=${STANDARDIZER_BASE_URL:-https://openrouter.ai/api/v1}
      - STANDARDIZER_SITE_URL=${STANDARDIZER_SITE_URL:-}
      - STANDARDIZER_APP_NAME=${STANDARDIZER_APP_NAME:-pocr}
    volumes:
      - ocr_jobs:/tmp/ocr_jobs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: paddleocr-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    profiles:
      - with-redis

volumes:
  ocr_jobs:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: paddleocr-network
